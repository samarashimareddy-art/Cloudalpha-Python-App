name: CI Pipeline for FastAPI Python App
on:
  push:
    branches: [main]
jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint with Ruff
        run: ruff check .
      - name: Run tests with pytest
        run: pytest
      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=cloudalpha-python-app -Dsonar.organization=samarashimareddy-art -Dsonar.host.url=https://sonarcloud.io

      - name: GitLeaks secret scan
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --exit-code 0 --report-path gitleaks-report.json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: cloudalpha-python-app:ci
      - name: Run Trivy image scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            aquasec/trivy:latest fs --scanners vuln,misconfig,secret --severity CRITICAL,HIGH --exit-code 0 --no-progress \
            cloudalpha-python-app:ci
